<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">README standardization workflow</title>
  <desc id="description">Repository evidence flows through bilingual writing, privacy review, visual composition, and rendered validation</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1210" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#052E2B"/>
    </linearGradient>
    <linearGradient id="core" x1="430" y1="196" x2="850" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F3D35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- The hero uses a dark neutral surface so it remains readable in both GitHub themes -->
  <rect width="1280" height="620" rx="32" fill="url(#background)"/>
  <g opacity="0.14" stroke="#94A3B8">
    <path d="M0 100h1280M0 200h1280M0 300h1280M0 400h1280M0 500h1280"/>
    <path d="M160 0v620M320 0v620M480 0v620M640 0v620M800 0v620M960 0v620M1120 0v620"/>
  </g>
  <text x="640" y="66" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">EVIDENCE-BACKED README PIPELINE</text>
  <text x="640" y="104" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Facts in · bilingual project entry out · unsafe publication blocked</text>
  <!-- Side cards summarize the four independent quality gates -->
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="165" width="270" height="126" rx="20" fill="#172033" stroke="#38BDF8" stroke-width="2"/>
    <text x="98" y="205" fill="#7DD3FC" font-size="16" font-weight="700">01 · EVIDENCE</text>
    <text x="98" y="239" fill="#F8FAFC" font-size="22" font-weight="700">Repository facts</text>
    <text x="98" y="269" fill="#CBD5E1" font-size="16">Code · tests · docs · assets</text>
    <rect x="70" y="329" width="270" height="126" rx="20" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="98" y="369" fill="#C4B5FD" font-size="16" font-weight="700">02 · BILINGUAL</text>
    <text x="98" y="403" fill="#F8FAFC" font-size="22" font-weight="700">Chinese + English</text>
    <text x="98" y="433" fill="#CBD5E1" font-size="16">Shared facts and limitations</text>
    <rect x="940" y="165" width="270" height="126" rx="20" fill="#172033" stroke="#FB7185" stroke-width="2"/>
    <text x="968" y="205" fill="#FDA4AF" font-size="16" font-weight="700">03 · PRIVACY</text>
    <text x="968" y="239" fill="#F8FAFC" font-size="22" font-weight="700">Publication gate</text>
    <text x="968" y="269" fill="#CBD5E1" font-size="16">Secrets · identity · paths · URLs</text>
    <rect x="940" y="329" width="270" height="126" rx="20" fill="#172033" stroke="#4ADE80" stroke-width="2"/>
    <text x="968" y="369" fill="#86EFAC" font-size="16" font-weight="700">04 · VALIDATION</text>
    <text x="968" y="403" fill="#F8FAFC" font-size="22" font-weight="700">Rendered evidence</text>
    <text x="968" y="433" fill="#CBD5E1" font-size="16">Links · images · tables · Mermaid</text>
  </g>
  <!-- The central document shows the final repository landing page -->
  <g filter="url(#shadow)">
    <rect x="417" y="155" width="446" height="340" rx="28" fill="url(#core)" stroke="#334155" stroke-width="3"/>
    <rect x="466" y="197" width="348" height="252" rx="14" fill="#F8FAFC"/>
    <circle cx="505" cy="235" r="15" fill="#22C55E"/>
    <path d="m497 235 6 6 11-14" fill="none" stroke="#052E2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="536" y="224" width="212" height="15" rx="7.5" fill="#0F172A"/>
    <rect x="496" y="272" width="288" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="496" y="296" width="242" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="496" y="334" width="84" height="54" rx="10" fill="#E0F2FE" stroke="#38BDF8"/>
    <rect x="598" y="334" width="84" height="54" rx="10" fill="#EDE9FE" stroke="#A78BFA"/>
    <rect x="700" y="334" width="84" height="54" rx="10" fill="#DCFCE7" stroke="#4ADE80"/>
    <rect x="496" y="408" width="126" height="10" rx="5" fill="#94A3B8"/>
    <rect x="637" y="408" width="147" height="10" rx="5" fill="#94A3B8"/>
  </g>
  <!-- Connectors make the gate sequence explicit without implying remote data transfer -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10">
    <path d="M340 228h77" stroke="#38BDF8"/>
    <path d="M340 392h77" stroke="#A78BFA"/>
    <path d="M863 228h77" stroke="#FB7185"/>
    <path d="M863 392h77" stroke="#4ADE80"/>
  </g>
  <rect x="392" y="528" width="496" height="48" rx="24" fill="#052E2B" stroke="#22C55E"/>
  <text x="640" y="559" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PUBLISH ONLY AFTER EVERY HARD GATE PASSES</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">GitHub README Standardizer brand mark</title>
  <desc id="description">A document with bilingual lines, a privacy shield, and a validation check</desc>
  <defs>
    <linearGradient id="surface" x1="18" y1="16" x2="142" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#052E2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="42" y1="42" x2="126" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <!-- Rounded surface keeps the icon legible on light and dark GitHub themes -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#surface)" stroke="#334155" stroke-width="4"/>
  <!-- Document lines represent the synchronized Chinese and English entry points -->
  <path d="M43 35h57l21 21v55a14 14 0 0 1-14 14H43a14 14 0 0 1-14-14V49a14 14 0 0 1 14-14Z" fill="#F8FAFC"/>
  <path d="M100 35v21h21" fill="none" stroke="#CBD5E1" stroke-width="6" stroke-linejoin="round"/>
  <path d="M47 66h45M47 82h58M47 98h36" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
  <!-- Shield and check show that privacy review blocks unsafe publication -->
  <path d="M101 83 128 93v19c0 18-11 29-27 35-16-6-27-17-27-35V93l27-10Z" fill="url(#accent)" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
  <path d="m87 113 9 9 19-22" fill="none" stroke="#052E2B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
